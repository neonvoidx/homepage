name: Deploy to Homepage

on:
  push:
    branches: [v4]
    paths:
      - "content/**"
      - "quartz.config.ts"
      - "quartz.layout.ts"
      - "quartz-static/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for git-based modified dates

      - name: Checkout Quartz source
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: quartz-src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: quartz-src

      - name: Copy content and config into Quartz workspace
        run: |
          rm -rf quartz-src/content
          cp -r content quartz-src/content
          cp quartz.config.ts quartz-src/quartz.config.ts
          cp quartz.layout.ts quartz-src/quartz.layout.ts
          cp -r quartz-static/. quartz-src/quartz/static/

      - name: Build site
        run: npx quartz build
        working-directory: quartz-src

      - name: Deploy to neonvoidx/homepage
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.TARGET_REPO_TOKEN }}
          external_repository: neonvoidx/homepage
          publish_branch: gh-pages
          publish_dir: quartz-src/public
          cname: neonvoid.dev
